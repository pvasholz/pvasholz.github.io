    <h2 class="mb-4">Your Quiz Results</h2>

    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"

  ></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('resultsContainer');
      const stored = localStorage.getItem('tfQuizResults');

      // If no quiz data is found, inform the user.
      if (!stored) {
        container.innerHTML =
          '<div class="alert alert-warning">No quiz data found. Please take the quiz first.</div>';
        return;
      }

      // Parse the stored JSON
      const { answers, score, total } = JSON.parse(stored);

      // 1) Show overall score
      container.innerHTML = `
        <div class="alert alert-info">
          You answered <strong>${score}</strong> out of <strong>${total}</strong> questions correctly.
        </div>
      `;

      // 2) Define the question texts
      const questions = {
        q1: "The Margherita pizza was named after an Italian queen.",
        q2: "Chicago deep dish pizza was invented in 1941 (not 1920).",
        q3: "The most popular pizza topping in America is Sausage (not Pineapple).",
        q4: "The most popular style of pizza in America is New York style."
      };

      // 3) Correct answers map (used to compare each response)
      const correctAnswers = {
        q1: true,
        q2: false,
        q3: false,
        q4: true
      };

      // 4) Build a list with the question text + badge for each
      const ul = document.createElement('ul');
      ul.className = 'list-group';

      Object.keys(questions).forEach(qKey => {
        const userVal = answers[qKey];
        const wasCorrect = userVal === correctAnswers[qKey];

        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';

        // Show the actual question text
        li.textContent = questions[qKey];

        // Badge: ✓ if correct, ✕ if wrong, “No answer” if null
        let badgeHTML;
        if (userVal === null) {
          badgeHTML = '<span class="badge bg-secondary">No answer</span>';
        } else if (wasCorrect) {
          badgeHTML = '<span class="badge bg-success">✓ Correct</span>';
        } else {
          badgeHTML = '<span class="badge bg-danger">✕ Wrong</span>';
        }

        // Append the badge after the question text
        li.insertAdjacentHTML('beforeend', badgeHTML);
        ul.appendChild(li);
      });

      container.appendChild(ul);
    });
  </script>
