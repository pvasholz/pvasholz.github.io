<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>History of Pizza</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-…"
    crossorigin="anonymous"
  />

  
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .clickable-img {
      cursor: zoom-in;
      transition: transform 0.3s;
    }
    .clickable-img.enlarged {
      transform: scale(1.5);
      cursor: zoom-out;
    }
  </style>
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-sm navbar-dark bg-primary">
          <div class="container">
            <a class="navbar-brand" href="index.html">How to Make a Pizza</a>
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navMenu"
              aria-controls="navMenu"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
              <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>
                <li class="nav-item"><a class="nav-link active" href="styles.html">Styles</a></li>
                
                <li class="nav-item"><a class="nav-link" href="demo.html">Demo</a></li>
                <li class="nav-item"><a class="nav-link" href="feedback.html">Feedback</a></li>
              </ul>
            </div>
          </div>
        </nav>
      </header>

  <main class="container py-5">
    <h2 class="mb-4">Combined Quiz Results</h2>

    <!-- Pre‑Lesson Results Section -->
    <h3>Pre Lesson Matching Quiz</h3>
    <div id="preResultContainer" class="mb-5"></div>

    <!-- Post‑Lesson Results Section -->
    <h3>Post Lesson Matching Quiz</h3>
    <div id="postResultContainer"></div>

    <div class="mt-5">
      <a href="demo.html" class="btn btn-secondary">&raquo; Next</a>
    </div>
  </main>

  <!-- Bootstrap JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const preContainer = document.getElementById('preResultContainer');
      const postContainer = document.getElementById('postResultContainer');

      /* 1) Render Pre‑Lesson Results */
      const storedPre = localStorage.getItem('stylesQuizResults');
      if (!storedPre) {
        preContainer.innerHTML =
          '<div class="alert alert-warning">No pre‑lesson quiz recorded.</div>';
      } else {
        const { answers, score, total } = JSON.parse(storedPre);

        // Question texts same as in styles.html
        const questionsPre = {
          q1: 'Photo 1: Neapolitan pizza',
          q2: 'Photo 2: Chicago Deep‑Dish pizza',
          q3: 'Photo 3: Detroit pizza',
          q4: 'Photo 4: New York style pizza'
        };
        const correctPre = {
          q1: 'Neapolitan',
          q2: 'Chicago',
          q3: 'Detroit',
          q4: 'New York'
        };

        // Overall pre‑lesson score
        preContainer.innerHTML = `
          <div class="alert alert-info">
            Pre‑lesson: You got <strong>${score}</strong> out of <strong>${total}</strong> correct.
          </div>
        `;

        // Per‑question feedback
        const ulPre = document.createElement('ul');
        ulPre.className = 'list-group';
        Object.keys(questionsPre).forEach(key => {
          const userVal = answers[key];
          const correctVal = correctPre[key];
          const wasCorrect = (userVal === correctVal);
          const li = document.createElement('li');
          li.className = 'list-group-item';
          li.innerHTML = `
            <div>${questionsPre[key]}</div>
            <div>
              <strong>Your answer:</strong> ${userVal || '<em>None</em>'}<br>
              <strong>Correct:</strong> ${correctVal}
              ${wasCorrect
                ? '<span class="badge bg-success ms-2">✔</span>'
                : '<span class="badge bg-danger ms-2">✘</span>'}
            </div>
          `;
          ulPre.appendChild(li);
        });
        preContainer.appendChild(ulPre);
      }

      /* 2) Render Post‑Lesson Results */
      const storedPost = localStorage.getItem('postStylesQuizResults');
      if (!storedPost) {
        postContainer.innerHTML =
          '<div class="alert alert-warning">No post‑lesson quiz recorded.</div>';
      } else {
        const { answers: postAnswers, score: postScore, total: postTotal } =
          JSON.parse(storedPost);

        // Question texts same as pre‑lesson (matching test)
        const questionsPost = {
          q1: 'Photo 1: Neapolitan pizza',
          q2: 'Photo 2: Chicago Deep‑Dish pizza',
          q3: 'Photo 3: Detroit pizza',
          q4: 'Photo 4: New York style pizza'
        };
        const correctPost = {
          q1: 'Neapolitan',
          q2: 'Chicago',
          q3: 'Detroit',
          q4: 'New York'
        };

        // Overall post‑lesson score
        postContainer.innerHTML = `
          <div class="alert alert-info">
            Post‑lesson: You got <strong>${postScore}</strong> out of <strong>${postTotal}</strong> correct.
          </div>
        `;

        // Per‑question feedback
        const ulPost = document.createElement('ul');
        ulPost.className = 'list-group';
        Object.keys(questionsPost).forEach(key => {
          const userVal = postAnswers[key];
          const correctVal = correctPost[key];
          const wasCorrect = (userVal === correctVal);
          const li = document.createElement('li');
          li.className = 'list-group-item';
          li.innerHTML = `
            <div>${questionsPost[key]}</div>
            <div>
              <strong>Your answer:</strong> ${userVal || '<em>None</em>'}<br>
              <strong>Correct:</strong> ${correctVal}
              ${wasCorrect
                ? '<span class="badge bg-success ms-2">✔</span>'
                : '<span class="badge bg-danger ms-2">✘</span>'}
            </div>
          `;
          ulPost.appendChild(li);
        });
        postContainer.appendChild(ulPost);
      }
    });
  </script>
</body>
</html>
